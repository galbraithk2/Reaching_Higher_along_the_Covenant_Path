<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <clipPath id="bg">
      <rect width="400" height="400" rx="36"/>
    </clipPath>
  </defs>
  <g clip-path="url(#bg)">
    <!-- Background -->
    <rect width="400" height="400" fill="#C53030"/>
    <!-- Bottom band -->
    <rect x="0" y="280" width="400" height="120" fill="#8B1A1A"/>
    <!-- Document — centered at x=200, same proportions as original -->
    <path d="M100 34 L270 34 L300 66 L300 280 L100 280 Z" fill="white"/>
    <!-- Fold corner -->
    <path d="M270 34 L300 66 L270 66 Z" fill="#F0A0A0"/>
    <!-- PDF badge — centered at x=200 -->
    <rect x="152" y="114" width="96" height="42" rx="6" fill="#9B2C2C"/>
    <text x="200" y="143" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="white" text-anchor="middle">PDF</text>
    <!-- Content lines — centered at x=200 -->
    <rect x="150" y="172" width="100" height="9" rx="4" fill="#F5AAAA"/>
    <rect x="158" y="191" width="84" height="9" rx="4" fill="#F5AAAA"/>
    <rect x="166" y="210" width="68" height="9" rx="4" fill="#F5AAAA"/>
    <!-- Bottom text -->
    <text x="200" y="326" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="0.5">AND SHOULD WE DIE</text>
    <text x="200" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFAAAA" text-anchor="middle">PDF</text>
  </g>
</svg>
