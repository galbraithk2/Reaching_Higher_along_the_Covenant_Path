<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <clipPath id="outer-doc">
      <rect width="400" height="400" rx="32"/>
    </clipPath>
  </defs>
  <g clip-path="url(#outer-doc)">
    <!-- Main background -->
    <rect width="400" height="400" fill="#2B5CE6"/>
    <!-- Bottom darker band -->
    <rect x="0" y="290" width="400" height="110" fill="#1A3A9E"/>

    <!-- Document white shape -->
    <path d="M118 52 L248 52 L278 82 L278 272 L118 272 Z" fill="white"/>
    <!-- Folded corner triangle -->
    <path d="M248 52 L278 82 L248 82 Z" fill="#A0BEF5"/>

    <!-- W badge -->
