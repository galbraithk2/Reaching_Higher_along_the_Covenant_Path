    <text x="188" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">W</text>

    <!-- Content lines -->
    <rect x="148" y="168" width="96" height="8" rx="4" fill="#A0BEF5"/>
    <rect x="148" y="186" width="84" height="8" rx="4" fill="#A0BEF5"/>
    <rect x="148" y="204" width="72" height="8" rx="4" fill="#A0BEF5"/>

    <!-- Bottom label -->
    <text x="200" y="333" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="0.5">AND SHOULD WE DIE</text>
    <text x="200" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#A0BEF5" text-anchor="middle">WORD DOC</text>
  </g>
</svg>
