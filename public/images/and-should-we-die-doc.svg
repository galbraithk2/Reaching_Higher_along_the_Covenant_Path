<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <clipPath id="outer-doc">
      <rect width="400" height="400" rx="36"/>
    </clipPath>
  </defs>
  <g clip-path="url(#outer-doc)">
    <!-- Main background -->
    <rect width="400" height="400" fill="#2B5CE6"/>
    <!-- Bottom darker band -->
    <rect x="0" y="278" width="400" height="122" fill="#1A3A9E"/>

    <!-- Document white shape — large, matching original proportions -->
    <path d="M98 34 L262 34 L294 66 L294 278 L98 278 Z" fill="white"/>
    <!-- Folded corner -->
    <path d="M262 34 L294 66 L262 66 Z" fill="#A0C0F5"/>

    <!-- W badge — large, centered -->
    <rect x="134" y="116" width="96" height="42" rx="6" fill="#1A3A9E"/>
    <text x="182" y="145" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="white" text-anchor="middle">W</text>

    <!-- Content lines -->
    <rect x="132" y="174" width="104" height="9" rx="4.5" fill="#A0C0F5"/>
    <rect x="132" y="194" width="92" height="9" rx="4.5" fill="#A0C0F5"/>
    <rect x="132" y="214" width="78" height="9" rx="4.5" fill="#A0C0F5"/>

    <!-- Bottom label -->
    <text x="200" y="326" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="0.5">AND SHOULD WE DIE</text>
    <text x="200" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A0C0F5" text-anchor="middle">WORD DOC</text>
  </g>
</svg>
